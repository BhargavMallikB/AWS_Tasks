service: users-lambda-api

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-south-1
  memorySize: 128
  timeout: 10
  httpApi:
    cors: true
  environment:
    BUCKET_NAME: users-data-file
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::users-data-file
            - arn:aws:s3:::users-data-file/*

functions:
  getAllUsers:
    handler: src/handlers/getAllUsers.handler
    events:
      - httpApi:
          path: /users
          method: GET
  
  getAllAddresses:
    handler: src/handlers/getAllAddresses.handler
    events:
      - httpApi:
          path: /addresses
          method: GET

  getUserById:
    handler: src/handlers/getUserById.handler
    events:
      - httpApi:
          path: /users/{id}
          method: GET

  insertUser:
    handler: src/handlers/insertUser.handler
    events:
      - httpApi:
          path: /users
          method: POST

  updateUserById:
    handler: src/handlers/updateUserById.handler
    events:
      - httpApi:
          path: /users/{id}
          method: PATCH

  deleteUserById:
    handler: src/handlers/deleteUserById.handler
    events:
      - httpApi:
          path: /users/{id}
          method: DELETE

package:
  individually: true

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
